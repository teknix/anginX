services:
  anginx:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "18080:80"
      - "18443:443"
    environment:
      ANGINX_API_KEY: integrationkey
      ANGINX_SSL_MODE: dynamic
      ANGINX_MAX_SERVICES: "100"
    volumes:
      - anginx_conf_d:/etc/nginx/conf.d
      - ./test-certs:/etc/nginx/certs:ro
    networks:
      - test_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  upstream:
    image: python:3.11-alpine
    command: >
      sh -c "pip install flask -q && python -c \"
      from flask import Flask; app = Flask(__name__)
      @app.route('/')
      def index(): return 'hello from upstream'
      app.run(host='0.0.0.0', port=7705)
      \""
    networks:
      - test_net

networks:
  test_net:

volumes:
  anginx_conf_d:
