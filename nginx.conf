user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format anginx '$remote_addr - $request_time [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log anginx;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Max upload body. Freightbox POD/POP photos from phones run 2-5 MB;
    # nginx default is 1m, which 413s them at the edge before the app sees it.
    # Keep >= the app MAX_CONTENT_LENGTH (freightbox: MAX_CONTENT_LENGTH_MB) and
    # >= synapse max_upload_size (50M default) -- Matrix media uploads
    # (matrix-watcher scanner PDFs) got 413d at lower caps.
    client_max_body_size 50m;

    # Port 80: API control plane + HTTP→HTTPS redirect for everything else
    server {
        listen 80 default_server;

        location = /new {
            include /etc/nginx/conf.base/_lan_only.conf;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /services {
            include /etc/nginx/conf.base/_lan_only.conf;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /dashboard {
            include /etc/nginx/conf.base/_lan_only.conf;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health {
            include /etc/nginx/conf.base/_lan_only.conf;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Catch-all for :443. Without this, an unmatched SNI falls through to the
    # FIRST server block in conf.d (alphabetical) -- which once served DATA.Bunker
    # at the stockbox URL. ssl_reject_handshake (nginx >=1.19.4) refuses the TLS
    # handshake outright, so no vhost is ever leaked and no cert is needed here.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Per-service HTTPS server blocks (generated by the API)
    include /etc/nginx/conf.d/*.conf;
}
