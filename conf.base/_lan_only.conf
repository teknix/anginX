# Control-plane access: localhost + private LAN only; public internet denied.
# Docker bridge gateway and sibling containers land in 172.16/12, so host-local
# services reaching the published port and other containers both pass.
# ponytail: assumes default bridge DNAT preserves source IP. If the daemon runs
# with userland-proxy=true, external IPs get rewritten to the gateway and would
# pass — keep userland-proxy off (the modern default).
allow 127.0.0.1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
