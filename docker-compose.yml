services:
  anginx:
    build: .
    container_name: anginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ANGINX_API_KEY: "${ANGINX_API_KEY}"
      ANGINX_MAX_SERVICES: "${ANGINX_MAX_SERVICES:-100}"
      ANGINX_DOMAINS: "${ANGINX_DOMAINS:-}"
      ANGINX_EMAIL: "${ANGINX_EMAIL:-}"
      ANGINX_ALLOW_HTTP: "${ANGINX_ALLOW_HTTP:-0}"
      ANGINX_TTL: "${ANGINX_TTL:-90}"
      ANGINX_REAP_INTERVAL: "${ANGINX_REAP_INTERVAL:-30}"
    volumes:
      - anginx_conf_d:/etc/nginx/conf.d
      - anginx_certs:/etc/nginx/certs
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  anginx_conf_d:
  anginx_certs:
