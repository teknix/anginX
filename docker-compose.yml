services:
  anginx:
    build: .
    container_name: anginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ANGINX_API_KEY: "${ANGINX_API_KEY}"
      ANGINX_MAX_SERVICES: "${ANGINX_MAX_SERVICES:-100}"
      ANGINX_DOMAINS: "${ANGINX_DOMAINS:-}"
      ANGINX_EMAIL: "${ANGINX_EMAIL:-}"
    volumes:
      - anginx_conf_d:/etc/nginx/conf.d
      - anginx_certs:/etc/nginx/certs
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  anginx_conf_d:
  anginx_certs:
